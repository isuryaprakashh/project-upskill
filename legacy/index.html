<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Upskill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
 --bg:#F7F8FA;--surface:#FFFFFF;--surface2:#F2F4F7;--line:#E4E7EC;--line2:#D0D5DD;
 --ink:#101828;--ink2:#475467;--ink3:#667085;--ink4:#98A2B3;
 --primary:#3457C4;--primary-ink:#FFFFFF;--primary-soft:#EEF2FC;
 --ok:#0F6E56;--ok-soft:#E1F5EE;--bad:#B42318;--bad-soft:#FEF3F2;--warn:#854F0B;--warn-soft:#FAEEDA;
 --dsa:#378ADD;--dsa-ink:#185FA5;--dsa-soft:#E6F1FB;
 --sd:#1D9E75;--sd-ink:#0F6E56;--sd-soft:#E1F5EE;
 --build:#7F77DD;--build-ink:#534AB7;--build-soft:#EEEDFE;
 --speak:#EF9F27;--speak-ink:#854F0B;--speak-soft:#FAEEDA;
 --research:#D85A30;--research-ink:#993C1D;--research-soft:#FAECE7;
 --review:#888780;--review-ink:#5F5E5A;--review-soft:#F1EFE8;
 --read:#888780;--read-ink:#5F5E5A;--read-soft:#F1EFE8;
 --pencil:#4E4B66;--pblue:#2F6FD6;--pred:#D93A32;--pgreen:#2F8A46;--porange:#E06A10;--pamber:#0F6E56;--hl:#CFE0FF;
 --r:14px;--rs:10px;--shadow:0 1px 2px rgba(16,24,40,.05);
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 color-scheme:dark;--bg:#0C0E12;--surface:#14171C;--surface2:#1B1F26;--line:#262B33;--line2:#333A44;
 --ink:#F2F4F7;--ink2:#C2C8D0;--ink3:#98A2B3;--ink4:#667085;--primary:#6E8EF0;--primary-ink:#0C0E12;--primary-soft:#1A2340;
 --ok:#5DCAA5;--ok-soft:#0F2B28;--bad:#F97066;--bad-soft:#3A1517;--warn:#FAC775;--warn-soft:#33240A;
 --dsa-ink:#85B7EB;--dsa-soft:#10233A;--sd-ink:#5DCAA5;--sd-soft:#0F2B28;--build-ink:#AFA9EC;--build-soft:#221F45;
 --speak-ink:#FAC775;--speak-soft:#33240A;--research-ink:#F0997B;--research-soft:#3A1E16;--review-ink:#C2C0B6;--review-soft:#24231F;--read-ink:#C2C0B6;--read-soft:#24231F;
 --pencil:#B8B6C8;--pblue:#85B7EB;--pred:#F09595;--pgreen:#97C459;--porange:#F0997B;--pamber:#5DCAA5;--hl:#1E3A63;--shadow:none}}
:root[data-theme="dark"]{
 color-scheme:dark;--bg:#0C0E12;--surface:#14171C;--surface2:#1B1F26;--line:#262B33;--line2:#333A44;
 --ink:#F2F4F7;--ink2:#C2C8D0;--ink3:#98A2B3;--ink4:#667085;--primary:#6E8EF0;--primary-ink:#0C0E12;--primary-soft:#1A2340;
 --ok:#5DCAA5;--ok-soft:#0F2B28;--bad:#F97066;--bad-soft:#3A1517;--warn:#FAC775;--warn-soft:#33240A;
 --dsa-ink:#85B7EB;--dsa-soft:#10233A;--sd-ink:#5DCAA5;--sd-soft:#0F2B28;--build-ink:#AFA9EC;--build-soft:#221F45;
 --speak-ink:#FAC775;--speak-soft:#33240A;--research-ink:#F0997B;--research-soft:#3A1E16;--review-ink:#C2C0B6;--review-soft:#24231F;--read-ink:#C2C0B6;--read-soft:#24231F;
 --pencil:#B8B6C8;--pblue:#85B7EB;--pred:#F09595;--pgreen:#97C459;--porange:#F0997B;--pamber:#5DCAA5;--hl:#1E3A63;--shadow:none}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
.mono,pre,code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.sr{position:absolute;left:-9999px}
/* ---------- shell ---------- */
.side{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{max-width:720px;margin:0 auto;height:54px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.main{max-width:720px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
body.full .main{padding-bottom:24px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:720px;margin:0 auto;display:flex}
.navb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:11px;font-weight:500;color:var(--ink3)}
.navb.on{color:var(--primary)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
body.full .bnav{display:none}
@media (min-width:960px){
 .topbar,.bnav{display:none}
 body::before{display:none}
 .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:236px;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px}
 .side .brand{padding:4px 10px 20px}
 .side .navb{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;min-height:38px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--ink2)}
 .side .navb.on{background:var(--surface2);color:var(--ink)}
 .side .navb.on .ico{color:var(--primary)}
 .side .navb:hover{background:var(--surface2)}
 .side .sec{font-size:11.5px;font-weight:600;color:var(--ink4);padding:16px 10px 6px;text-transform:none}
 .side .foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--ink3)}
 .main{max-width:1040px;margin:0 0 0 236px;padding:28px 40px 48px}
 body.full .main{padding-bottom:48px}
}
/* ---------- type ---------- */
.eyebrow{font-size:12.5px;color:var(--ink3);font-weight:500;margin:0 0 2px}
h1{font-size:24px;line-height:1.25;letter-spacing:-.015em;font-weight:600;margin:0 0 16px}
h2{font-size:17px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:600;margin:0 0 8px}
.muted{color:var(--ink3);font-size:13px}
.sub{color:var(--ink2);margin:-8px 0 18px;font-size:14px}
/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
@media (min-width:720px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{border:1px solid transparent;border-radius:var(--rs);min-height:40px;padding:0 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn.p{background:var(--primary);color:var(--primary-ink)}
.btn.p:hover{filter:brightness(1.07)}
.btn.s{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn.s:hover{background:var(--surface2)}
.btn.g{background:transparent;color:var(--ink2)}
.btn.g:hover{background:var(--surface2)}
.btn.w{width:100%}
.btn.lg{min-height:46px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--ink2)}
.t-dsa{background:var(--dsa-soft);color:var(--dsa-ink)}.t-sd{background:var(--sd-soft);color:var(--sd-ink)}.t-build{background:var(--build-soft);color:var(--build-ink)}
.t-speak{background:var(--speak-soft);color:var(--speak-ink)}.t-research{background:var(--research-soft);color:var(--research-ink)}.t-review,.t-read{background:var(--review-soft);color:var(--review-ink)}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-p{background:var(--primary-soft);color:var(--primary)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:3px}
.c-dsa{background:var(--dsa)}.c-sd{background:var(--sd)}.c-build{background:var(--build)}.c-speak{background:var(--speak)}.c-research{background:var(--research)}.c-review,.c-read{background:var(--read)}
.tile{flex:0 0 36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:48px}
.li:first-child{border-top:0}
.li .mid{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink3);display:block}
button.li:hover{background:var(--surface2);border-radius:8px}
.li.lock{opacity:.5}
.chev{color:var(--ink4)}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:var(--rs);padding:3px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink3);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.chk{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 2px;font-size:14px;line-height:1.45}
.bx{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:var(--surface);display:flex;align-items:center;justify-content:center;margin-top:1px}
[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok)}
[aria-pressed="true"] .bx:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk[aria-pressed="true"] .ct{color:var(--ink3);text-decoration:line-through}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:var(--rs);padding:9px 11px;width:100%}
textarea{min-height:88px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:28px 12px;color:var(--ink3);font-size:14px}
.callout{border-radius:var(--rs);padding:11px 13px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media (min-width:960px){.toast{bottom:28px;margin-left:118px}}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:16px}}
.back{border:0;background:none;color:var(--ink3);font-size:13.5px;font-weight:500;min-height:40px;padding:0;display:inline-flex;align-items:center;gap:4px}
.crumb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.kpi b{display:block;font-size:19px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink3)}
/* ---------- lesson ---------- */
.lgrid{display:block}
.rail{display:none}
@media (min-width:960px){
 .lgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
 .rail{display:block;list-style:none;margin:0;padding:0;position:sticky;top:20px}
 .rail button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;border-radius:8px;padding:7px 9px;font-size:13.5px;color:var(--ink3);min-height:36px}
 .rail button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow);border:1px solid var(--line)}
 .rail b{flex:0 0 20px;height:20px;border-radius:10px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
 .rail button.done b{background:var(--ok);border-color:var(--ok);color:#fff}
 .rail button.on b{border-color:var(--primary);color:var(--primary)}
 .prog,.pname{display:none!important}
}
.lmain{max-width:700px}
.prog{display:flex;gap:4px;margin:4px 0 6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--primary)}
.pname{font-size:12.5px;color:var(--ink3);margin:0 0 14px}
.q{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:0 0 10px}
.lead{color:var(--ink2);margin:0 0 12px;font-size:15px}
.para{margin:0 0 14px;font-size:15px}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px;font-weight:600}
.what{margin:0;padding-left:20px}.what li{margin:0 0 4px}
.sk{display:block;width:100%;height:auto}
.sk .g{stroke:var(--pencil);stroke-width:1.8}.sk .bl{stroke:var(--pblue);stroke-width:2}.sk .rd{stroke:var(--pred);stroke-width:2.2}.sk .gr{stroke:var(--pgreen);stroke-width:2.2}.sk .or{stroke:var(--porange);stroke-width:2}
.sk .hy{fill:url(#hy);stroke:var(--pamber);stroke-width:2}.sk .hb{fill:url(#hb);stroke:var(--pblue);stroke-width:2}
.sk text{stroke:none;font-family:Caveat,cursive;font-size:17px;fill:var(--ink)}
.sk .tb{fill:var(--pblue)}.sk .tr{fill:var(--pred)}.sk .tg{fill:var(--pgreen)}.sk .to{fill:var(--porange)}
.cap{font-family:Caveat,cursive;font-size:19px;color:var(--ink2);margin:6px 2px 0;line-height:1.2}
.step{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-size:14px}
.step b{flex:0 0 22px;height:22px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-size:12px;display:flex;align-items:center;justify-content:center}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.dial{position:relative;height:28px;margin:6px 2px 8px}
.dial:before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;background:var(--line2)}
.dial i{position:absolute;top:11px;left:0;height:6px;background:var(--primary-soft);border-radius:3px}
.dial em{position:absolute;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--primary)}
.two{display:flex;gap:12px}.two div{flex:1;font-size:13px;color:var(--ink2)}.two b{display:block;color:var(--ink);font-size:13.5px}.two div:last-child{text-align:right}
pre{margin:0;font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre;background:var(--surface2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.one{background:var(--primary-soft);border-radius:var(--rs);padding:11px 13px}
.one small{display:block;font-size:12px;color:var(--primary);font-weight:600}
.recap{margin:0;padding-left:20px}.recap li{margin:0 0 5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:11px 13px;font-size:14px;font-weight:500;min-height:46px}
.opt:not(:disabled):hover{border-color:var(--ink4)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.lvl{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.lvl.Easy{background:var(--ok-soft);color:var(--ok)}.lvl.Medium{background:var(--warn-soft);color:var(--warn)}.lvl.Hard{background:var(--bad-soft);color:var(--bad)}
.foot2{position:sticky;bottom:0;z-index:15;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;margin-top:8px;border-top:1px solid var(--line)}
.foot2 .btn{flex:1}
.timer{font-family:"JetBrains Mono",monospace;font-size:44px;font-weight:500;text-align:center;letter-spacing:-.02em;margin:8px 0}
.rate{display:flex;gap:6px}
.rate button{flex:1;border:1px solid var(--line2);background:var(--surface);border-radius:8px;min-height:40px;font-weight:600}
.rate button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.status{border:0;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
@media (hover:hover){.card.click:hover{border-color:var(--line2)}}

/* ---------- bento dashboard ---------- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:112px;text-align:left;box-shadow:var(--shadow);min-width:0}
button.tl{cursor:pointer;font:inherit;color:inherit}
button.tl:hover{border-color:var(--line2)}
.tl .k{font-size:12px;color:var(--ink3);font-weight:500}
.tl .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tl .d{font-size:12.5px;color:var(--ink3)}
.tl .tt{font-size:15px;font-weight:600;line-height:1.3}
.tl.w2{grid-column:span 2}
.tl.hero{grid-column:span 2;background:var(--primary);color:var(--primary-ink);border-color:transparent;min-height:164px;padding:18px}
.tl.hero .k{color:inherit;opacity:.8}
.tl.hero .tt{font-size:20px;letter-spacing:-.01em}
.tl.hero .d{color:inherit;opacity:.8}
.tl.hero .hbtn{margin-top:auto;align-self:flex-start;background:var(--surface);color:var(--primary);border:0;border-radius:10px;min-height:40px;padding:0 16px;font-weight:600;font-size:14px}
.tl.spk{background:var(--speak-soft);border-color:transparent;color:var(--speak-ink)}
.tl.spk .k,.tl.spk .d{color:inherit;opacity:.85}
.tl .foot{margin-top:auto;font-size:13px;font-weight:600}
.wk7{display:flex;gap:5px;margin-top:8px}
.wk7 span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink3)}
.wk7 i{display:block;width:100%;height:30px;border-radius:7px;background:var(--surface2)}
.wk7 .now i{outline:2px solid var(--ink);outline-offset:1px}
.wk7 i.c-dsa{background:var(--dsa)}.wk7 i.c-sd{background:var(--sd)}.wk7 i.c-build{background:var(--build)}.wk7 i.c-research{background:var(--research)}.wk7 i.c-review{background:var(--read)}

research:{name:'Research',when:'Saturdays',tag:'Sat',blurb:'From reading papers to copying a real result, then reaching a professor.',weeks:[
 {t:'How to read a research paper',why:'Most people read papers like textbooks and give up. Researchers read them in three passes.',steps:['Learn the three-pass method: skim, understand, then rebuild it in your head.','First pass on the ResNet paper (He et al., 2015, "Deep Residual Learning"): title, abstract, figures, conclusion only.','Write 5 lines: problem, idea, main result, what you didn\u2019t get, one question.'],out:'A 5-line summary of ResNet.'},
 {t:'Second and third pass on ResNet',why:'The second pass is where the idea clicks. The third is where you could explain it to a professor.',steps:['Second pass: read every section, sketch the residual block yourself.','Third pass: why does a skip connection make deep nets easier to train?','One page: problem, idea, experiments, results, limitations.'],out:'One page of ResNet notes.'},
 {t:'Math refresh: matrices as layers',why:'A neural network layer is a matrix multiply plus a function. Seeing that makes papers far easier.',steps:['Revise shapes: (batch \u00d7 in) times (in \u00d7 out).','Code a 2-layer MLP forward pass in NumPy, no frameworks.','Check every shape with assert statements.'],out:'A NumPy MLP forward pass.'},
 {t:'Math refresh: loss and gradients',why:'Every training loop is "measure the error, then step downhill". Knowing why softmax plus cross-entropy works helps you read any paper.',steps:['Derive the gradient of softmax + cross-entropy on paper.','Code backprop for your MLP.','Verify it with a numerical gradient check.'],out:'Backprop that passes a gradient check.'},
 {t:'Optimizers and learning rates',why:'Half of "it doesn\u2019t train" problems are the optimizer or the learning rate.',steps:['Train your MLP with SGD, SGD with momentum, and Adam.','Try 3 learning rates for each.','Plot the loss curves side by side.'],out:'A chart comparing optimizers.'},
 {t:'Reproduce part 1: the training loop',why:'Copying a paper\u2019s result is how researchers check they truly understand it.',steps:['Set up a PyTorch training loop for CIFAR-10.','Build ResNet-20 as described in the paper\u2019s CIFAR section.','Fix random seeds and log accuracy every epoch.'],out:'A working, logged training script.'},
 {t:'Reproduce part 2: plain vs residual',why:'The paper\u2019s key claim: a deeper plain network trains worse, and skip connections fix it.',steps:['Train a plain 20-layer net and ResNet-20 with the same settings.','If time allows, add a 32-layer version of each.','Make a table: does your trend match the paper\u2019s?'],out:'A results table vs the paper.'},
 {t:'Your first ablation',why:'An ablation removes one piece to see what it was doing. It\u2019s the most common experiment in research.',steps:['Pick one change: remove batch norm, or change the depth.','Run it with the same seed and settings.','Write what changed and why you think it happened.'],out:'One ablation, honestly reported.'},

 PR(88,'merge-sorted-array','Merge Sorted Array','Easy','nums1 has empty room at the end. Merge nums2 into it so everything is sorted, in place.',['Filling from the front overwrites values you still need.','Fill from the back: compare the largest remaining of each and write it at the end.'],L('public void merge(int[] nums1, int m, int[] nums2, int n) {','  int i = m - 1, j = n - 1, k = m + n - 1;','  while (j >= 0) {','    if (i >= 0 && nums1[i] > nums2[j]) nums1[k--] = nums1[i--];','    else nums1[k--] = nums2[j--];','  }','}'),'O(m + n) time, O(1) space','Looping while i >= 0 instead of j >= 0 leaves nums2 items behind.'),
 PR(977,'squares-of-a-sorted-array','Squares of a Sorted Array','Easy','Return the squares of a sorted array, also in sorted order.',['Negatives can have big squares, so the largest square sits at one of the two ends.','Two pointers from both ends. Write the bigger square at the back of the answer.'],L('public int[] sortedSquares(int[] nums) {','  int n = nums.length, l = 0, r = n - 1;','  int[] ans = new int[n];','  for (int k = n - 1; k >= 0; k--) {','    int a = nums[l] * nums[l], b = nums[r] * nums[r];','    if (a > b) { ans[k] = a; l++; } else { ans[k] = b; r--; }','  }','  return ans;','}'),'O(n) time, O(n) for the answer','Squaring then sorting works, but it\u2019s O(n log n).')]);

 PR(146,'lru-cache','LRU Cache','Medium','Design a cache with get and put in O(1). When full, evict the least recently used key.',['A HashMap from key to node, plus a doubly linked list in order of use.','On get or put, move the node to the front. When over capacity, remove from the back.'],L('class LRUCache {','  private class Node { int k, v; Node prev, next; Node(int k, int v) { this.k = k; this.v = v; } }','  private final int cap;','  private final Map<Integer, Node> map = new HashMap<>();','  private final Node head = new Node(0, 0), tail = new Node(0, 0);','','  public LRUCache(int capacity) { cap = capacity; head.next = tail; tail.prev = head; }','','  public int get(int key) {','    Node n = map.get(key);','    if (n == null) return -1;','    remove(n); addFront(n);','    return n.v;','  }','','  public void put(int key, int value) {','    Node n = map.get(key);','    if (n != null) { n.v = value; remove(n); addFront(n); return; }','    if (map.size() == cap) { Node lru = tail.prev; remove(lru); map.remove(lru.k); }','    n = new Node(key, value);','    map.put(key, n); addFront(n);','  }','','  private void remove(Node n) { n.prev.next = n.next; n.next.prev = n.prev; }','  private void addFront(Node n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }','}'),'O(1) per operation','Forgetting to remove the evicted key from the HashMap.',true)],true);

 cap:'Go down to choose, come back up to undo.',

 PR(102,'binary-tree-level-order-traversal','Binary Tree Level Order Traversal','Medium','Return the values level by level, top to bottom.',['Use a queue, starting with the root.','Record the queue size first: that many nodes belong to the current level.'],L('public List<List<Integer>> levelOrder(TreeNode root) {','  List<List<Integer>> res = new ArrayList<>();','  if (root == null) return res;','  Queue<TreeNode> q = new ArrayDeque<>();','  q.add(root);','  while (!q.isEmpty()) {','    int size = q.size();','    List<Integer> level = new ArrayList<>();','    for (int i = 0; i < size; i++) {','      TreeNode n = q.poll();','      level.add(n.val);','      if (n.left != null) q.add(n.left);','      if (n.right != null) q.add(n.right);','    }','    res.add(level);','  }','  return res;','}'),'O(n) time, O(width) space','Using q.size() inside the loop condition changes as you add children.'),
 PR(199,'binary-tree-right-side-view','Binary Tree Right Side View','Medium','Standing to the right of the tree, which nodes can you see, top to bottom?',['Go level by level.','The last node of each level is the visible one.'],L('public List<Integer> rightSideView(TreeNode root) {','  List<Integer> res = new ArrayList<>();','  if (root == null) return res;','  Queue<TreeNode> q = new ArrayDeque<>();','  q.add(root);','  while (!q.isEmpty()) {','    int size = q.size();','    for (int i = 0; i < size; i++) {','      TreeNode n = q.poll();','      if (i == size - 1) res.add(n.val);','      if (n.left != null) q.add(n.left);','      if (n.right != null) q.add(n.right);','    }','  }','  return res;','}'),'O(n) time','Only following right children misses nodes on the left that stick out lower down.')]);

 PR(105,'construct-binary-tree-from-preorder-and-inorder-traversal','Construct Binary Tree from Preorder and Inorder Traversal','Medium','Rebuild a binary tree from its preorder and inorder traversals.',['The first preorder value is the root.','Its position in inorder splits the values into the left and right subtrees.'],L('private int pre = 0;','private final Map<Integer, Integer> pos = new HashMap<>();','','public TreeNode buildTree(int[] preorder, int[] inorder) {','  pre = 0;','  pos.clear();','  for (int i = 0; i < inorder.length; i++) pos.put(inorder[i], i);','  return build(preorder, 0, inorder.length - 1);','}','','private TreeNode build(int[] preorder, int lo, int hi) {','  if (lo > hi) return null;','  TreeNode root = new TreeNode(preorder[pre++]);','  int mid = pos.get(root.val);','  root.left = build(preorder, lo, mid - 1);','  root.right = build(preorder, mid + 1, hi);','  return root;','}'),'O(n) time with the HashMap','Building the right subtree before the left uses preorder values in the wrong order.')]);

/* ---------- live jobs ---------- */
var LKEY='upskill-jobs-cache';
function liveCache(){try{return JSON.parse(localStorage.getItem(LKEY))}catch(e){return null}}
function ago(iso){var d=Math.floor((Date.now()-Date.parse(iso))/86400000);return d<=0?'today':(d===1?'1 day ago':d+' days ago')}
function loadLive(force){
 var c=liveCache();
 if(!force&&c&&c.url===P.jobsApi&&Date.now()-c.t<6*3600000){return}
 liveState={loading:true,err:''};live();
 fetch(P.jobsApi,{headers:{'Accept':'application/json'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
  if(!d||!Array.isArray(d.jobs))throw new Error('Unexpected response');
  try{localStorage.setItem(LKEY,JSON.stringify({t:Date.now(),url:P.jobsApi,data:d}))}catch(e){}
  liveState={loading:false,err:''};live();
 }).catch(function(e){liveState={loading:false,err:String(e.message||e)};live()});
}
function live(){
 var box=$('live');if(!box)return;
 if(!P.jobsApi){
  box.innerHTML='<div class="card"><h2>Connect your jobs feed</h2><p class="muted" style="margin:4px 0 12px">Live fresher-friendly remote jobs from Himalayas and Remotive, filtered to Worldwide and India, refreshed twice a day by your own Cloudflare Worker.</p>'+
  '<ol class="recap" style="margin-bottom:14px"><li>Install the Cloudflare CLI: <code>npm i -g wrangler</code>, then <code>wrangler login</code>.</li><li>Put <b>worker.js</b> and <b>wrangler.toml</b> in one folder and run <code>wrangler deploy</code>.</li><li>In Cloudflare, add a custom domain to the Worker, like <code>jobs.yourdomain.com</code>, so caching works.</li><li>Paste its address below, ending in <code>/jobs</code>.</li></ol>'+
  '<div class="field"><label for="japi">Jobs API address</label><input id="japi" type="url" placeholder="https://jobs.yourdomain.com/jobs"></div><button class="btn p" id="jsave">Connect</button></div>';
  $('jsave').onclick=function(){var v=$('japi').value.trim();if(!/^https:\/\//.test(v)){toast('Use an https:// address');return}P.jobsApi=v;save();loadLive(true)};
  return;
 }
 var c=liveCache(),data=c&&c.url===P.jobsApi?c.data:null;
 if(!data&&!liveState.loading&&!liveState.err){loadLive(false);return}
 var h='<div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:10px"><span class="muted">'+(liveState.loading?'Loading jobs\u2026':(data?data.count+' jobs \u00b7 updated '+ago(data.updated):''))+'</span><div class="row"><button class="btn s" id="jref" style="min-height:34px"'+(liveState.loading?' disabled':'')+'>Refresh</button><button class="btn g" id="jset" style="min-height:34px">Change feed</button></div></div>';
 if(liveState.err)h+='<div class="callout b-bad" style="margin-bottom:12px"><b>Couldn\u2019t load jobs.</b> '+esc(liveState.err)+'. Check the address works in your browser. Inside Claude\u2019s preview, outside requests are blocked, so open your hosted copy.</div>';
 if(data){
  h+='<div class="seg" style="margin-bottom:8px">'+[['fresher','Fresher-friendly'],['all','All entry-level']].map(function(x){return '<button data-lv="'+x[0]+'" class="'+(liveLvl===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="row" style="margin-bottom:12px;gap:8px"><div class="seg" style="margin:0;flex:0 0 auto">'+['All','Worldwide','India'].map(function(x){return '<button data-lw="'+x+'" class="'+(liveWhere===x?'on':'')+'">'+x+'</button>'}).join('')+'</div><label class="sr" for="jq">Search jobs</label><input id="jq" type="search" placeholder="Search: java, react, intern" value="'+esc(liveQ)+'" style="flex:1;min-width:0"></div>';
  var saved={};P.jobs.forEach(function(j){if(j.link)saved[j.link]=1});
  var q=liveQ.toLowerCase();
  var L=data.jobs.filter(function(j){
   if(liveLvl==='fresher'&&!(j.level==='Entry-level'||j.level==='Internship'))return false;
   if(liveWhere==='Worldwide'&&j.where!=='Worldwide')return false;
   if(liveWhere==='India'&&!/India/.test(j.where))return false;
   if(q&&(j.title+' '+j.company).toLowerCase().indexOf(q)<0)return false;return true});
  h+='<div class="stack">';
  if(!L.length)h+='<div class="card empty">No jobs match these filters. Try "All entry-level" or clear the search.</div>';
  L.slice(0,60).forEach(function(j,i){h+='<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px"><div style="min-width:0"><h2 class="ch" style="margin:0 0 2px;font-size:15px">'+esc(j.title)+'</h2><p class="muted" style="margin:0">'+esc(j.company)+' \u00b7 '+esc(j.type||'Remote')+' \u00b7 '+ago(j.date)+'</p></div><span class="badge '+(j.level==='Not stated'?'':'b-ok')+'">'+esc(j.level)+'</span></div>'+
   '<div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px"><span class="badge b-p">'+esc(j.where)+'</span>'+(j.salary?'<span class="badge">'+esc(j.salary)+'</span>':'')+'<span class="muted" style="margin-left:auto">via <a href="'+esc(safe(j.sourceUrl))+'" target="_blank" rel="noopener">'+esc(j.source)+'</a></span></div>'+
   '<div class="row" style="margin-top:10px"><a class="btn p" style="flex:1;text-decoration:none" href="'+esc(safe(j.url))+'" target="_blank" rel="noopener">Apply \u2197</a><button class="btn s" style="flex:1" data-save="'+i+'"'+(saved[j.url]?' disabled':'')+'>'+(saved[j.url]?'Saved \u2713':'Save to tracker')+'</button></div></div>'});
  h+='</div><p class="muted" style="margin-top:12px">Jobs from <a href="https://himalayas.app" target="_blank" rel="noopener">Himalayas</a> and <a href="https://remotive.com" target="_blank" rel="noopener">Remotive</a>. "Not stated" means the post doesn\u2019t say a level but isn\u2019t senior. Always check the requirements.</p>';
  box.innerHTML=h;
  box.querySelectorAll('[data-lv]').forEach(function(b){b.onclick=function(){liveLvl=b.dataset.lv;live()}});
  box.querySelectorAll('[data-lw]').forEach(function(b){b.onclick=function(){liveWhere=b.dataset.lw;live()}});
  var qi2=$('jq');qi2.oninput=function(){liveQ=this.value;var pos=this.selectionStart;live();var n=$('jq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}};
  box.querySelectorAll('[data-save]').forEach(function(b){b.onclick=function(){var j=L[+b.dataset.save];P.jobs.push({id:'j'+Date.now(),company:j.company,role:j.title,loc:/India/.test(j.where)?'India':'Remote',status:'Saved',link:j.url,referral:'',applied:'',follow:'',notes:'From '+j.source,updated:Date.now()});save();toast('Saved to your tracker');live()}});
 }else box.innerHTML=h;
 if($('jref'))$('jref').onclick=function(){loadLive(true)};
 if($('jset'))$('jset').onclick=function(){P.jobsApi='';save();live()};
}

function opt(list,v){return list.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

 h+=fld('jk','Job link',j.link,'url')+fld('jf2','Referral (person\u2019s name, if any)',j.referral);

 $('panel').innerHTML=h;$('sheet').classList.add('on');$('fx').onclick=closeSheet;
 $('js').onchange=function(){if(this.value==='Applied'){if(!$('ja').value)$('ja').value=dstr(today());if(!$('jw').value)$('jw').value=dstr(today()+7)}};
 if($('fdel'))$('fdel').onclick=function(){P.jobs=P.jobs.filter(function(x){return x.id!==j.id});save();closeSheet();career();toast('Deleted')};

  var o={id:j.id||('j'+Date.now()),company:c,role:r,loc:$('jl').value,status:$('js').value,link:$('jk').value.trim(),referral:$('jf2').value.trim(),applied:$('ja').value,follow:$('jw').value,notes:$('jn').value,updated:Date.now()};

 if(id==='how'){h+='<h1>How it works</h1><p class="sub">24 weeks, about 60 minutes a day.</p><div class="card"><table class="tbl"><tr><th>Day</th><th>Subject</th></tr><tr><td>Mon, Wed, Fri</td><td>DSA: learn, practice, one note</td></tr><tr><td>Tue, Thu</td><td>System design + AWS: read, AWS service, hands-on lab</td></tr><tr><td>Saturday</td><td>Build Career OS: React, React Native, Spring Boot, Cloudflare</td></tr><tr><td>Sunday</td><td>Research, or review + trends + apply sprint (alternating)</td></tr><tr><td>Every day</td><td>10 minutes of speaking practice</td></tr></table></div><div class="card" style="margin-top:12px"><h2 class="ch">Phases</h2><ol class="recap"><li>Weeks 1\u20138: foundations</li><li>Weeks 9\u201316: building blocks</li><li>Weeks 17\u201324: interview mode, AWS exam, launch, applications</li></ol><p class="muted" style="margin:8px 0 0">Behind? No problem. Today always opens the next unfinished session of that day\u2019s track.</p></div>';app.innerHTML=h;bindBack();return}
 var code=JSON.stringify(P);

 h+='<div class="card"><h2 class="ch">Restore</h2><p class="muted" style="margin:0 0 8px">This replaces the progress on this device.</p><label class="sr" for="bk2">Paste backup code</label><textarea id="bk2" class="mono" style="font-size:12px" placeholder="Paste a backup code here"></textarea><button class="btn s" id="bkrest" style="margin-top:10px">'+(restoreArm?'Tap again to replace this device\u2019s progress':'Restore')+'</button></div></div>';
 app.innerHTML=h;bindBack();
 $('bkcopy').onclick=function(){copy($('bk1').value)};
